apiVersion: apps/v1
kind: Deployment
metadata:
  name: mp298-api
  labels:
    app: mp298-api
spec:
  replicas: 4
  selector:
    matchLabels:
      app: mp298-api
  template:
    metadata:
      labels:
        app: mp298-api
    spec:
      containers:
      - name: mp298-api
        image: mp298-api:1.0
        ports:
        - containerPort: 8000
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 15

